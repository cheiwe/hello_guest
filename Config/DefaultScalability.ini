; Overrides of the engine scalability presets (Low=0, Medium=1, High=2, Epic=3).
; Low: no Lumen, sky light only. Medium: cheap software Lumen. High/Epic: engine defaults.
; Values are a starting point and will be tuned during playtests.

[GlobalIlluminationQuality@1]
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.ScreenProbeGather.DownsampleFactor=32
r.Lumen.TraceMeshSDFs=0

[ReflectionQuality@1]
r.Lumen.Reflections.Allow=1
